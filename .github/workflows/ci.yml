name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { cc: gcc, cxx: g++ }
          - { cc: clang, cxx: clang++ }
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSHEET_WERROR=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build -C Release --output-on-failure

  sanitizers:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ASAN, TSAN]
    steps:
      - uses: actions/checkout@v4
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSHEET_${{ matrix.sanitizer }}=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -P tools/fetch_data.cmake
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: clang-format-18 --dry-run --Werror src/*.cpp src/*.h tests/*.cpp tests/*.h
